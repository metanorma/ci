name: 'ghostscript-setup-action'
description: 'Installs ghostscript for all OSes'
runs:
  using: "composite"
  steps:
    - shell: python
      run: |
        import sys, os, glob
        sys.path.insert(0, os.path.join(os.environ['GITHUB_ACTION_PATH'], '..', '_shared'))
        from tool_runner import get_platform_name, run_commands

        platform_name = get_platform_name()

        if platform_name == "Windows":
          # choco ghostscript is an empty metapackage whose
          # ghostscript.app dependency no longer resolves on the
          # Community Repo (2026-09). The Artifex NSIS installer is also
          # unusable here: run silently it wedges forever before
          # extracting a file — an elevation prompt it cannot display on
          # a headless runner (observed 2026-09-25/26). The payload is
          # unpacked with 7-Zip instead — no installer, no elevation —
          # and the discovered bin/lib directories go on PATH.
          run_commands([
            "curl -L -o C:\\gs10040w64.exe https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/gs10040w64.exe",
            '"C:\\Program Files\\7-Zip\\7z.exe" x -y -oC:\\gs-payload C:\\gs10040w64.exe',
          ])
          gs_exe = glob.glob("C:\\gs-payload\\**\\gswin64c.exe", recursive=True)
          if not gs_exe:
            for root, dirs, files in os.walk("C:\\gs-payload"):
              print(root, "->", dirs[:8])
            print("gswin64c.exe not found in the extracted payload")
            sys.exit(1)
          gs_bin = os.path.dirname(gs_exe[0])
          gs_lib = os.path.join(os.path.dirname(gs_bin), "lib")
          if not os.path.isdir(gs_lib):
            gs_lib = gs_bin
          run_commands([
            "echo {}>> {}".format(gs_bin, os.environ["GITHUB_PATH"]),
            "echo {}>> {}".format(gs_lib, os.environ["GITHUB_PATH"]),
            "\"{}\\gswin64c.exe\" --version".format(gs_bin),
          ])
        else:
          run_commands({
            "Darwin": [
              "brew install ghostscript",
              "gs --version",
            ],
            "Ubuntu": [
              "sudo apt update --fix-missing",
              "sudo apt upgrade -y",
              "sudo apt install -y ghostscript",
              "which gs",
              "gs --version",
              "which ps2pdf",
            ],
            "Linux": [
              "sudo apt install -y ghostscript",
              "which gs",
              "gs --version",
              "which ps2pdf",
            ],
          }.get(platform_name, [
            "echo 'Unsupported platform: {}'".format(platform_name),
            "exit 1"
          ]))
