name: 'ghostscript-setup-action'
description: 'Installs ghostscript for all OSes'
runs:
  using: "composite"
  steps:
    - shell: python
      run: |
        import sys, os, glob
        sys.path.insert(0, os.path.join(os.environ['GITHUB_ACTION_PATH'], '..', '_shared'))
        from tool_runner import get_platform_name, run_commands

        platform_name = get_platform_name()

        if platform_name == "Windows":
          # choco ghostscript is an empty metapackage whose
          # ghostscript.app dependency no longer resolves on the
          # Community Repo (2026-09) — installing it yields no
          # binaries. Download the Artifex installer directly and
          # install silently with /S — fingerprinting gs10040w64.exe
          # shows Nullsoft (NSIS).
          run_commands([
            "curl -L -o C:\\gs10040w64.exe https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/gs10040w64.exe",
            "C:\\gs10040w64.exe /S",
          ])
          # The NSIS build can land per-machine (Program Files) or
          # per-user (LocalAppData Programs) depending on elevation;
          # search both before giving up, and say WHERE it looked.
          gs_dirs = sorted(glob.glob("C:\\Program Files\\gs\\gs*")) or sorted(
            glob.glob(os.path.expandvars("%LOCALAPPDATA%\\Programs\\gs\\gs*"))
          )
          if not gs_dirs:
            for root in ("C:\\Program Files", "C:\\Program Files (x86)",
                         os.path.expandvars("%LOCALAPPDATA%\\Programs")):
              print("scanned %s: %s" % (root, sorted(glob.glob(root + "\\*"))))
            print("Ghostscript installation directory not found")
            sys.exit(1)
          if gs_dirs:
            gs_root = gs_dirs[-1]
            gs_bin = os.path.join(gs_root, "bin")
            gs_lib = os.path.join(gs_root, "lib")
            run_commands([
              "echo {}>> {}".format(gs_bin, os.environ["GITHUB_PATH"]),
              "echo {}>> {}".format(gs_lib, os.environ["GITHUB_PATH"]),
              "\"{}\\gswin64c.exe\" --version".format(gs_bin),
              "\"{}\\ps2pdf\" --version".format(gs_lib),
            ])
          else:
            print("Ghostscript installation directory not found")
            sys.exit(1)
        else:
          run_commands({
            "Darwin": [
              "brew install ghostscript",
              "gs --version",
            ],
            "Ubuntu": [
              "sudo apt update --fix-missing",
              "sudo apt upgrade -y",
              "sudo apt install -y ghostscript",
              "which gs",
              "gs --version",
              "which ps2pdf",
            ],
            "Linux": [
              "sudo apt install -y ghostscript",
              "which gs",
              "gs --version",
              "which ps2pdf",
            ],
          }.get(platform_name, [
            "echo 'Unsupported platform: {}'".format(platform_name),
            "exit 1"
          ]))
