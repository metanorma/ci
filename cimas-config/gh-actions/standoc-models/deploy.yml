name: Build and Deploy Grammars

# LXR grammar-package + SPA HTML generation for EVERY flavour, deployed to
# GitHub Pages (one directory per flavour). One root Gemfile (lutaml-lml +
# lutaml-xsd + ruby-jing); each flavour directory carries only its
# build-config.yml schema set. The flavour matrix comes from flavors.txt —
# the same single source the root Makefile and the metanorma/ci path-filter
# read.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.list.outputs.flavors }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: echo "flavors=$(jq -R -s -c 'split("\n") | map(select(length > 0))' flavors.txt)" >> "$GITHUB_OUTPUT"

  build:
    needs: flavors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.flavors.outputs.flavors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Vendor submodule grammars
        run: ruby scripts/flatten-include-files.rb

      - name: Build LXR package
        working-directory: ${{ matrix.flavor }}
        run: bundle exec lutaml-xsd build from-config build-config.yml --output ${{ matrix.flavor }}.lxr

      - name: Generate SPA documentation
        working-directory: ${{ matrix.flavor }}
        run: bundle exec lutaml-xsd spa ${{ matrix.flavor }}.lxr --mode inlined --output ${{ matrix.flavor }}.html

      - name: Prepare artifact
        working-directory: ${{ matrix.flavor }}
        run: |
          mkdir -p _site/${{ matrix.flavor }}
          cp ${{ matrix.flavor }}.html _site/${{ matrix.flavor }}/index.html
          cp -r images _site/${{ matrix.flavor }}/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lxr-${{ matrix.flavor }}
          path: ${{ matrix.flavor }}/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (flavors.txt for the site index)
        uses: actions/checkout@v6
      - name: Download all flavour artifacts
        uses: actions/download-artifact@v5
        with:
          path: _artifacts
          pattern: lxr-*
          merge-multiple: true
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r _artifacts/*/* _site/
          cat > _site/index.html <<HTML
          <!doctype html><html><body><h1>Metanorma grammar packages</h1><ul>
          $(while read -r f; do echo "<li><a href=\"$f/\">$f</a></li>"; done < flavors.txt)
          </ul></body></html>
          HTML
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
