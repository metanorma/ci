# Test-only caller for repositories that run rake but do not participate
# in the release cascade. Least-privilege variant of rake.yml.
#
# Use for repos that:
#   - run `bundle exec rake` for CI, but
#   - do NOT publish a gem on tag push (no do-release consumer), and
#   - do NOT participate in the tests-passed downstream cascade.
#
# Consumers gain `contents: read` at the workflow level (least privilege)
# by giving up the `tests-passed` / `do-release` repository_dispatch fires.
#
# To switch a repo back to the cascade variant, replace this template
# mapping with `master/rake.yml` in the repo's cimas.yml entry.

name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: read

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake-test-only.yml@main
    secrets:
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
