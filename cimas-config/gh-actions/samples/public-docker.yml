name: docker

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: metanorma/metanorma:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          # Private submodules (e.g. the iso-10303-* docs repos'
          # iso-10303-stepmod-wg12) need a PAT with repo scope; repos
          # without the secret keep the default-token behavior.
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN || github.token }}

      - name: Metanorma generate site
        id: build-and-publish
        uses: actions-mn/build-and-publish@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          agree-to-terms: true
          destination: artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions-mn/deploy-pages@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
