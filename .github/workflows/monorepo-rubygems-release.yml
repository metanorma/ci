name: monorepo-rubygems-release

on:
  workflow_call:
    inputs:
      gem_name:
        description: >-
          Directory name of the gem to release (relative to gem_directory).
          Use "." for the root gem.
        required: true
        type: string
      gem_directory:
        description: Parent directory containing the gem directories
        required: false
        type: string
        default: '.'
      next_version:
        description: >-
          Next release version. Possible values: x.y.z, major, minor,
          patch (or pre|rc|etc).  Pass 'skip' to skip version bump and
          release the current gemspec version.
        required: true
        type: string
      gated:
        description: |
          DEPRECATED — IGNORED. Kept as a no-op input for backward compatibility
          with consumer repos that still pass it. The release workflow always
          publishes immediately; the idempotent push guard handles any duplicate
          push from a downstream do-release listener. See metanorma/ci#370.
        type: boolean
        default: false
      release_command:
        description: >-
          Command to build and publish the gem. Defaults to
          `gem build *.gemspec && gem push *.gem`.
        required: false
        type: string
        default: 'gem build *.gemspec && gem push *.gem'
      version_file:
        description: >-
          Path (relative to the gem directory) to the version file gem-release
          should bump. Leave empty for the standard `lib/<gem_name>/version.rb`
          layout. Set this when the version file lives at a non-standard path
          (e.g. `lib/foo/bar/version.rb` for a gem named `foo`).
        required: false
        type: string
        default: ''
      bundler_cache:
        description: 'do bundle install'
        required: false
        type: boolean
        default: true
      post_install:
        description: 'command to execute after bundle install'
        required: false
        type: string
        default: ''
      submodules:
        description: Checkout submodules
        required: false
        type: boolean
        default: true
      role_to_assume:
        description: 'OIDC Role ID from RubyGems.org for Trusted Publishing (optional - auto-discovered if not provided)'
        required: false
        type: string
      environment:
        description: >-
          GitHub environment name for protection rules
          (e.g. "release" for required approvers)
        required: false
        type: string
        default: ''
    secrets:
      rubygems-api-key:
        required: false
      pat_token:
        required: false

jobs:
  release:
    # On `pull_request` (closed), run ONLY when the merged head branch is a
    # release branch (`release/*`): that merge is the publish trigger
    # (recovery leg when the dispatch run's in-run wait timed out). Every
    # other PR close is a neutral skip — otherwise the publish tail would
    # run on ordinary PR closes, from the PR merge ref.
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      id-token: write
      # The bump step creates and auto-merges the release PR; reusable
      # workflow jobs narrow the caller's grants, so this must be declared
      # even though the caller wrapper already carries it (metanorma/ci#523).
      pull-requests: write
    env:
      HAVE_PAT_TOKEN: ${{ secrets.pat_token != '' }}
      HAS_API_KEY: ${{ secrets.rubygems-api-key != '' }}
      USE_OIDC: ${{ secrets.rubygems-api-key == '' }}
    defaults:
      run:
        working-directory: >-
          ${{ inputs.gem_directory }}/${{ inputs.gem_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Publish-leg precedence: the merged release PR's commit, then the
          # do-release payload ref, then the dispatch ref.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.client_payload.ref || github.ref }}
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.pat_token || github.token }}
          fetch-depth: 0

      - if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        run: git fetch --tags origin
        working-directory: .

      - if: ${{ env.HAVE_PAT_TOKEN == 'true' }}
        uses: metanorma/ci/gh-rubygems-setup-action@main
        with:
          token: ${{ secrets.pat_token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: ${{ inputs.bundler_cache }}
          working-directory: >-
            ${{ inputs.gem_directory }}/${{ inputs.gem_name }}

      - if: ${{ inputs.post_install != '' }}
        run: ${{ inputs.post_install }}

      # ============ Common git setup ============
      - run: |
          # The bare github-actions@github.com identity renders as
          # "invalid-email-address" author on modern GitHub — cla/ribose
          # then (correctly) blocks the release PR as an unattributed
          # committer (coridoc PR #342). The [bot] noreply form
          # attributes release-bump commits to github-actions[bot].
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        working-directory: .

      - run: gem install gem-release
        working-directory: .

      - name: Remove Gemfile.lock before bump
        run: rm -f Gemfile.lock

      # ============ Version bump (workflow_dispatch only) ============
      # Runs in the gem's own subdirectory so gem-release sees exactly one
      # gemspec. Running from the repo root would let gem-release traverse
      # every subdirectory and pick the wrong gem (or multiple) in a monorepo.
      # When version_file is set, pass --file so gem-release can locate
      # non-standard version paths (e.g. lib/foo/bar/version.rb for gem "foo").
      - name: Bump version on a release branch and open the release PR
        if: github.event_name == 'workflow_dispatch' && inputs.next_version != 'skip'
        env:
          GH_TOKEN: ${{ secrets.pat_token || github.token }}
        run: |
          # The PR-based release flow (metanorma/ci#515): the bump lands on
          # a release branch and a release PR carries it through the
          # repository's gates; THIS RUN waits for the merge, checks out
          # the merge commit, and publishes from it. The old direct push
          # (gem bump --tag --push) hit the GH006 wall on any repository
          # whose default branch carries a required status check.
          # gem-release bump defaults: commit, no tag, no push — exactly the
          # shape we want (the branch push below is explicit).
          if [ -n "${{ inputs.version_file }}" ]; then
            gem bump --version ${{ inputs.next_version }} --file '${{ inputs.version_file }}'
          else
            gem bump --version ${{ inputs.next_version }}
          fi
          # The step runs in the gem's own directory (job working-directory
          # default), so the gemspec is resolved from the CWD — the same
          # convention the "Resolve gem identity" step below uses.
          VERSION=$(ruby -e "puts Gem::Specification.load(Dir['*.gemspec'].first).version")
          BRANCH="release/${{ inputs.gem_name }}-v${VERSION}"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          # Reuse the release PR when one is already open for the branch
          # (re-dispatch after a partial failure); gh pr create would
          # otherwise fail the step.
          PR_URL=$(gh pr list --head "${BRANCH}" --state open --json url --jq '.[0].url')
          if [ -z "${PR_URL}" ]; then
            PR_URL=$(gh pr create \
              --base "${{ github.ref_name }}" --head "${BRANCH}" \
              --title "Release ${{ inputs.gem_name }} ${VERSION}" \
              --body "Release PR for ${{ inputs.gem_name }}. Merging it is the release: this run publishes the gem from the merge commit (Trusted Publishing or the configured API key). Opened by the release workflow (metanorma/ci#515).")
          fi
          echo "Release PR: ${PR_URL}"
          PRNUM=$(basename "$PR_URL")
          if ! gh pr merge "$PRNUM" --auto --rebase 2> /tmp/automerge-err.txt; then
            cat /tmp/automerge-err.txt >&2 || true
            echo "::warning title=Auto-merge unavailable::Merge the release PR manually — this run waits for the merge and publishes from it."
          fi
          {
            echo "## Release PR opened — this run publishes on merge"
            echo ""
            echo "${PR_URL}"
            echo ""
            echo "This run waits for the release pull request to merge (up to 20 minutes), then tags the merge commit and publishes ${{ inputs.gem_name }} to rubygems.org. If the wait times out, merge the pull request and dispatch next_version=skip."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Waiting for the release PR to merge (max 20 minutes)..."
          merged="false"
          for _ in $(seq 1 60); do
            state=$(gh pr view "$PRNUM" --json state,mergedAt 2> /dev/null || true)
            if printf '%s' "$state" | jq -e '.state == "MERGED" and .mergedAt != null' > /dev/null 2>&1; then
              merged="true"
              break
            fi
            sleep 20
          done
          if [ "$merged" != "true" ]; then
            echo "::error::The release PR did not merge within 20 minutes. Merge ${PR_URL} once its checks are green, then dispatch next_version=skip to publish from main."
            exit 1
          fi
          echo "Release PR merged — checking out the merge commit and publishing."
          MERGE_SHA=$(gh pr view "$PRNUM" --json mergeCommit --jq .mergeCommit.oid)
          # The merge commit exists only server-side; fetch the updated base
          # branch (the merge landed on it) so the SHA resolves locally.
          git fetch --force origin "+refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          git checkout --force "$MERGE_SHA"
          echo "BUMP_VIA_PR=false" >> "$GITHUB_ENV"

      # ============ Gem identity ============
      # Resolved AFTER the bump so name/version/gemspec reflect the just-bumped
      # version. If resolved before the bump, the idempotency guard, build, and
      # tag-ref steps would all see the pre-bump (already-published) version,
      # making the guard skip publishing the new gem while the new tag still
      # gets pushed — a silently-unpublished release.
      - name: Resolve gem identity
        id: gem-identity
        run: |
          GEMSPEC=$(ls *.gemspec | head -1)
          GEM_NAME=$(ruby -e "puts Gem::Specification.load('${GEMSPEC}').name")
          GEM_VERSION=$(ruby -e "puts Gem::Specification.load('${GEMSPEC}').version.to_s")
          echo "name=${GEM_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GEM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "gemspec=${GEMSPEC}" >> "$GITHUB_OUTPUT"

      # ============ Publish: API Key path ============
      - name: Idempotency guard (API key)
        if: env.HAS_API_KEY == 'true'
        uses: metanorma/ci/gem-idempotent-push-guard-action@main
        with:
          gem-name: ${{ steps.gem-identity.outputs.name }}
          gem-version: ${{ steps.gem-identity.outputs.version }}

      - if: env.HAS_API_KEY == 'true' && env.skip_push != 'true'
        name: Publish to RubyGems (API key)
        env:
          RUBYGEMS_API_KEY: ${{ secrets.rubygems-api-key }}
        run: |
          mkdir -p ~/.gem
          envsubst << 'EOF' > ~/.gem/credentials
          ---
          :rubygems_api_key: ${RUBYGEMS_API_KEY}
          EOF
          chmod 0600 ~/.gem/credentials
          ${{ inputs.release_command }}

      # ============ Publish: OIDC Trusted Publisher path ============
      - if: env.USE_OIDC == 'true'
        name: Configure RubyGems credentials for Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@v2.1.0
        with:
          role-to-assume: ${{ inputs.role_to_assume }}

      - name: Idempotency guard (OIDC)
        if: env.USE_OIDC == 'true'
        uses: metanorma/ci/gem-idempotent-push-guard-action@main
        with:
          gem-name: ${{ steps.gem-identity.outputs.name }}
          gem-version: ${{ steps.gem-identity.outputs.version }}

      - if: env.USE_OIDC == 'true' && env.skip_push != 'true'
        name: Build and push gem (OIDC)
        run: |
          gem build *.gemspec
          mkdir -p pkg
          mv *.gem pkg/
          gem push pkg/*.gem

      # rubygems-await (compact-index wait) REMOVED, porting the #509/#512
      # fix from release.yml/rubygems-release.yml: it reads the laggy
      # compact-index pipeline, times out on live gems, and crashes on
      # 0.5.4's CompactIndexClient::Cache#dependencies NoMethodError
      # (ceradoc-adoc 2.0.40 pushed successfully and the run still went
      # red on 2026-11-28). The API-polling step below is the
      # authoritative post-push verification; rubygems-await 0.5.4 is
      # the newest release (2024) so there is no upgrade path.
      - name: Verify gem published on rubygems.org
        if: env.skip_push != 'true'
        env:
          GEM_NAME: ${{ steps.gem-identity.outputs.name }}
          GEM_VERSION: ${{ steps.gem-identity.outputs.version }}
        run: |
          echo "Polling rubygems.org for ${GEM_NAME} version ${GEM_VERSION}..."
          for i in $(seq 1 24); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" \
              "https://rubygems.org/api/v1/versions/${GEM_NAME}.json" || true)
            if [[ "$status" == "200" ]]; then
              if curl -s "https://rubygems.org/api/v1/versions/${GEM_NAME}.json" \
                   | jq -e --arg v "$GEM_VERSION" '.[] | select(.number == $v) | .number' > /dev/null; then
                echo "OK ${GEM_NAME} ${GEM_VERSION} confirmed live on rubygems.org"
                exit 0
              fi
            fi
            echo "  attempt $i/24: not yet visible, sleeping 5s..."
            sleep 5
          done
          echo "::error::${GEM_NAME} ${GEM_VERSION} was not visible on rubygems.org after 120s of polling."
          echo "::error::Either the publish step failed silently or rubygems propagation is unusually slow."
          exit 1

      # ============ Ensure release tag (ci#403 defect 1, monorepo) ============
      # The OIDC publish path (gem build + gem push) never tags, and gem
      # bump no longer carries --tag in the PR-based flow, so without this
      # leg every monorepo release published with no git tag and the
      # release-passed dispatch advertised a ref that did not exist.
      # Idempotent: no-op when the tag already exists.
      - name: Ensure release tag exists
        env:
          TAG: v${{ steps.gem-identity.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "✓ Tag ${TAG} already exists on origin."
          else
            echo "Tag ${TAG} missing on origin — creating annotated tag at local HEAD (the merged release commit)."
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      # ============ GitHub Release notes floor (metanorma/ci#354) ============
      # Every tag this workflow publishes carries a GitHub Release with
      # auto-generated notes (PR titles since the previous tag). Never
      # overwrites an existing Release body.
      - name: Ensure GitHub Release for tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.gem-identity.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "✓ Release for $TAG already exists — leaving alone (never overwrite)."
          else
            echo "Creating GitHub Release for $TAG with auto-generated notes..."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
            echo "✓ Release created."
          fi

      # ============ Post-release event ============
      - name: Get current gem ref
        id: gem-tag-ref
        run: echo "value=refs/tags/v${{ steps.gem-identity.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Dispatch release-passed
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.pat_token || github.token }}
          repository: ${{ github.repository }}
          event-type: release-passed
          client-payload: >-
            {"ref": "${{ steps.gem-tag-ref.outputs.value }}",
             "sha": "${{ github.sha }}",
             "type": "release-passed",
             "gem-name": "${{ inputs.gem_name }}"}
