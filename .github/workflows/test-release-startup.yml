name: test-release-startup

# ci#531 bisect harness: dispatch through a pinned rubygems-release
# copy. A healthy graph-build fails LATER (no gemspec in this repo —
# a normal preflight failure); a startup_failure means the graph
# itself is broken. Zero publish risk.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  call:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@test-531-repro
    with:
      next_version: skip
