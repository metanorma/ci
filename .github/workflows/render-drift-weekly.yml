name: render-drift-weekly

# Weekly drift watch (ci#506): render every managed samples repo with the
# `:latest` metanorma image and compare against the frozen baseline
# (captured from the pinned tag). Posts the aggregated verdict to the
# render-drift tracking issue — same shape as the cimas drift-audit
# (#342). Runs on the ci#504 harness; the ci#505 vocabulary in each
# repo's acceptlist decides what is drift-accepted vs a regression.

on:
  schedule:
    - cron: "0 21 * * 4" # Thursdays 21:00 UTC — clear of release windows
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Render image tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  issues: write

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        samples_repo:
          # The managed samples family (keep in sync with cimas.yml's
          # samples group). The watcher triage additions are included.
          - mn-samples-iso
          - mn-samples-iec
          - mn-samples-itu
          - mn-samples-ogc
          - mn-samples-ietf
          - mn-samples-bipm
          - mn-samples-cc
          - mn-samples-iho
          - mn-samples-nist
          - mn-samples-ieee
          - mn-samples-standoc
          - mn-samples-ribose
          - mn-samples-jcgm
          - mn-samples-plateau
          - mn-samples-bsi
          - mn-samples-jis
          - mn-samples-un
          - mn-samples-mpfa
          - mn-samples-mbxif
          - mn-samples-pdfa
          - mn-samples-oiml
          - mn-samples-plateau-cg3
          # Remaining public mn-samples-* repos (ci#506: all public flavors).
          - mn-samples-csa
          - mn-samples-elf
          - mn-samples-enosema
          - mn-samples-expressdocs
          - mn-samples-gb
          - mn-samples-iala
          - mn-samples-iho-pdf
          - mn-samples-iso-10303
          - mn-samples-m3aawg
          - mn-samples-plateau-firelight-demo
          - mn-samples-plateau-html
          - mn-samples-swf
          - mn-samples-tex-iso
          - mn-samples-wmo
    uses: ./.github/workflows/render-baseline.yml
    with:
      samples_repo: ${{ matrix.samples_repo }}
      image_tag: ${{ inputs.image_tag || 'latest' }}
      mode: compare
    secrets:
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

  report:
    needs: drift
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      TRACKING_LABEL: render-drift-tracking
      TRACKING_TITLE: "render-drift-weekly: rolling report"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: render-diff-report-*
          path: /tmp/reports
        continue-on-error: true

      - name: Aggregate per-repo verdicts
        id: agg
        run: |
          mkdir -p /tmp/reports
          if python3 -I scripts/render_drift_report.py /tmp/reports \
              .github/workflows/render-drift-weekly.yml \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              > /tmp/drift-summary.md; then
            echo "bad=false" >> "$GITHUB_OUTPUT"
          else
            echo "bad=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Render drift — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            cat /tmp/drift-summary.md
          } | tee "$GITHUB_STEP_SUMMARY" > /tmp/drift-comment.md

      - name: Post to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          num=$(gh issue list --repo "${{ github.repository }}" \
            --label "$TRACKING_LABEL" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh label create "$TRACKING_LABEL" --repo "${{ github.repository }}" \
              --description "Rolling render-drift-weekly report (ci#506)" \
              --color "0e8a16" 2>/dev/null || true
            printf '%s\n' "Rolling tracking issue for render-drift-weekly (ci#506). Each run posts one comment with the per-repo verdict table. Do not close; the workflow finds it by label." > /tmp/tracking-body.md
            url=$(gh issue create --repo "${{ github.repository }}" \
              --title "$TRACKING_TITLE" --label "$TRACKING_LABEL" \
              --body-file /tmp/tracking-body.md)
            num="${url##*/}"
          fi
          gh issue comment "$num" --repo "${{ github.repository }}" --body-file /tmp/drift-comment.md

      - name: Fail when any repo regressed or has no report
        if: steps.agg.outputs.bad == 'true'
        run: |
          echo "::error::Render drift: at least one samples repo regressed or produced no report (see the summary table)."
          exit 1
