name: notify-js

# Reusable: after a gem release bumps its VERSION on the pushed branch,
# dispatch to the gem's Opal/npm "-js" sibling repository so it can
# compile and publish the same version.
#
# Call it from a workflow triggered by `push`: the VERSION change is
# detected across the whole push (github.event.before..github.sha), so
# a bump followed by other commits in the same push is still detected.

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to dispatch to, as owner/name (e.g. plurimath/mml-js)
        type: string
        required: true
      version-file:
        description: Ruby file holding `VERSION = "x.y.z"` (e.g. lib/mml/version.rb)
        type: string
        required: true
      event-type:
        description: repository_dispatch event type sent to the target repository
        type: string
        default: 'do-release'
        required: false
    secrets:
      pat_token:
        description: Token allowed to send repository_dispatch to the target repository
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch release to JS repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect a VERSION change in this push
        id: ver
        # Inputs and SHAs reach the shell through env; the SHAs are
        # checked to be hex before use.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -eu
          read_version() {
            git show "$1:$VERSION_FILE" 2>/dev/null \
              | grep -oE 'VERSION = "[^"]+"' | head -1 | cut -d'"' -f2
          }
          is_sha() { printf '%s' "$1" | grep -qE '^[0-9a-f]{40}$'; }
          if ! is_sha "$AFTER"; then
            echo "::error::unexpected commit SHA: $AFTER"
            exit 1
          fi
          if [ -n "$BEFORE" ] && ! is_sha "$BEFORE"; then
            echo "::error::unexpected commit SHA: $BEFORE"
            exit 1
          fi
          NEW=$(read_version "$AFTER")
          if [ -z "$NEW" ]; then
            echo "::error::could not read VERSION from $VERSION_FILE"
            exit 1
          fi
          # VERSION is published to npm by the target repository, so only
          # a semver string may leave this job. A RubyGems prerelease such
          # as 2.5.0.rc1 is not one.
          if ! printf '%s' "$NEW" \
            | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION $NEW is not a semver version npm can publish"
            exit 1
          fi
          OLD=""
          # An empty or all-zero BEFORE (the push created the branch) and a
          # BEFORE missing from history (a force push) all count as a
          # change.
          if [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            OLD=$(read_version "$BEFORE")
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "VERSION unchanged ($NEW); not dispatching"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION ${OLD:-<none>} -> $NEW"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Dispatch ${{ inputs.event-type }} to ${{ inputs.repository }}
        if: steps.ver.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.pat_token }}
          repository: ${{ inputs.repository }}
          event-type: ${{ inputs.event-type }}
          client-payload: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "ruby_ref": "v${{ steps.ver.outputs.version }}"
            }
