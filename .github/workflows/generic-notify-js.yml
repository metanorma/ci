name: notify-js

# Reusable: after a successful gem release, dispatch to the gem's
# Opal/npm "-js" sibling repository so it can compile and publish the
# same version.
#
# Call it from a workflow triggered by `workflow_run` on the release
# workflow completing, for example:
#
#   on:
#     workflow_run:
#       workflows: [release]
#       types: [completed]
#       branches: [main]
#   jobs:
#     notify:
#       if: github.event.workflow_run.conclusion == 'success'
#       uses: metanorma/ci/.github/workflows/generic-notify-js.yml@main
#       with:
#         repository: plurimath/mml-js
#         version-file: lib/mml/version.rb
#       secrets:
#         pat_token: ${{ secrets.PLURIMATH_CI_PAT_TOKEN }}
#
# The caller listens for the release workflow finishing rather than for
# the version-bump push: when the release workflow pushes that bump with
# the repository GITHUB_TOKEN, GitHub starts no push-triggered runs for
# it.
#
# The version is bound to the release run's head_sha, not read from
# the branch tip. Only a commit that carries the tag v<VERSION> for its own
# version-file is dispatched, and that commit must be one of two:
#
# - head_sha's child: the commit on the branch's first-parent line whose
#   parent is head_sha. The release bumps the version in a commit on
#   top of the branch it checks out, and tags it; normally that is
#   head_sha, so the bump is this child. This is the normal case.
# - head_sha itself: a recovery run. When a release run bumps and tags
#   but then fails, a new release run started without a bump (next_version=skip) on the
#   branch, whose tip is the tagged bump commit, has that commit as its
#   head_sha. This applies only while no later v* tag exists on the
#   branch after head_sha; otherwise head_sha's release is not the latest
#   and a run on it is not treated as its recovery.
#
# Anything else dispatches nothing. A version file that cannot be read,
# or that does not have exactly one `VERSION = "..."` line, fails the
# job.
#
# Known limits. The release checks out the branch tip, not head_sha, so
# the child of head_sha is the commit this run tagged only if the branch
# did not move in between. If it moved, the new release is not
# dispatched; if the commit that moved it was itself a tagged release
# (another run, or a re-run of this one, which keeps the first
# attempt's head_sha), that earlier version is dispatched again
# instead. A run that made no bump, whose head_sha's child is a release
# commit tagged since, dispatches that version too. The same version
# can therefore be dispatched more than once, and the target repository has to treat
# an already-published version as done. A missed release is sent by
# starting a release run without a bump (next_version=skip) while the branch tip is still that
# release's commit.

on:
  workflow_call:
    inputs:
      repository:
        description: Repository to dispatch to, as owner/name (e.g. plurimath/mml-js)
        type: string
        required: true
      version-file:
        description: Ruby file holding `VERSION = "x.y.z"` (e.g. lib/mml/version.rb)
        type: string
        required: true
      event-type:
        description: repository_dispatch event type sent to the target repository
        type: string
        default: 'do-release'
        required: false
    secrets:
      pat_token:
        description: Token allowed to send repository_dispatch to the target repository
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch release to JS repository
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find the version this release run tagged
        id: ver
        # Event values and inputs reach the shell through env; the SHA
        # is checked to be hex before use.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HEAD_SHA" | grep -qxE '[0-9a-f]{40}'; then
            printf '::error::unexpected head_sha: %q\n' "$HEAD_SHA"
            exit 1
          fi
          if ! git check-ref-format "refs/heads/$BRANCH"; then
            printf '::error::unexpected head_branch: %q\n' "$BRANCH"
            exit 1
          fi
          # Sets V to the VERSION string in the version-file at commit
          # $1; fails the job if the file or the line is missing.
          read_version() {
            local source
            if ! source=$(git show "$1:$VERSION_FILE"); then
              printf '::error::cannot read %q at %s\n' "$VERSION_FILE" "$1"
              exit 1
            fi
            # Only an assignment at the start of a line counts, and it has
            # to be the only one.
            local lines
            lines=$(printf '%s\n' "$source" \
              | { grep -E '^[[:space:]]*VERSION = "[^"]+"' || true; })
            V=$(printf '%s\n' "$lines" | sed -n '1s/^[^"]*"\([^"]*\)".*$/\1/p')
            if [ -z "$V" ] || [ "$(printf '%s\n' "$lines" | wc -l)" -ne 1 ]; then
              printf '::error::no VERSION = "..." line in %q at %s\n' "$VERSION_FILE" "$1"
              exit 1
            fi
          }
          tag_commit() { git rev-parse -q --verify "refs/tags/v$1^{commit}" || true; }
          RELEASE=""
          NEW=""
          # Normal run: the bump commit is the commit on the branch's
          # first-parent line whose parent is head_sha.
          BUMP=$(git rev-list --first-parent --parents "refs/remotes/origin/$BRANCH" \
            | awk -v h="$HEAD_SHA" '!found && $2 == h { print $1; found = 1 }')
          if [ -n "$BUMP" ]; then
            read_version "$BUMP"
            if [ "$(tag_commit "$V")" = "$BUMP" ]; then
              RELEASE=$BUMP
              NEW=$V
            fi
          fi
          # Recovery run: head_sha is on the branch and is itself the
          # tagged release commit.
          # A v* tag on a commit after head_sha means a later release
          # exists, so this run is not a recovery of head_sha's release.
          if [ -z "$RELEASE" ] && git merge-base --is-ancestor "$HEAD_SHA" "refs/remotes/origin/$BRANCH" 2>/dev/null \
            && [ -z "$(git tag -l 'v*' --merged "refs/remotes/origin/$BRANCH" --no-merged "$HEAD_SHA")" ]; then
            read_version "$HEAD_SHA"
            if [ "$(tag_commit "$V")" = "$HEAD_SHA" ]; then
              RELEASE=$HEAD_SHA
              NEW=$V
            fi
          fi
          if [ -z "$RELEASE" ]; then
            echo "no release commit for this run; not dispatching"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # VERSION is published to npm by the target repository, so only
          # a semver string may leave this job. A RubyGems prerelease such
          # as 2.5.0.rc1 is not one.
          # grep matches line by line, so a value with a newline is
          # refused before it reaches grep.
          if [[ "$NEW" == *$'\n'* ]] || ! printf '%s' "$NEW" \
            | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'; then
            printf '::error::VERSION %q is not a semver version npm can publish\n' "$NEW"
            exit 1
          fi
          echo "release commit $RELEASE is tagged v$NEW; dispatching"
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Dispatch ${{ inputs.event-type }} to ${{ inputs.repository }}
        if: steps.ver.outputs.dispatch == 'true'
        # v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.pat_token }}
          repository: ${{ inputs.repository }}
          event-type: ${{ inputs.event-type }}
          client-payload: |
            {
              "version": "${{ steps.ver.outputs.version }}",
              "ruby_ref": "v${{ steps.ver.outputs.version }}"
            }
