name: rake

on:
  workflow_call:
    inputs:
      samples-matrix-json-file:
        description: 'Samples testing matrix JSON file'
        default: '.github/workflows/samples-matrix-part.json'
        required: false
        type: string
      templates-matrix-json-file:
        description: 'Templates testing matrix JSON file'
        default: '.github/workflows/templates-matrix-part.json'
        required: false
        type: string
    secrets:
      pat_token:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  rake:
    name: Test on Ruby ${{ matrix.ruby.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    needs: prepare
    if: needs.prepare.outputs.push-for-tag != 'true'

    concurrency:
      group: '${{ github.workflow }}-${{ matrix.os }}-${{ matrix.ruby.version }}-${{ github.head_ref || github.ref_name }}'
      cancel-in-progress: true

    continue-on-error: ${{ matrix.ruby.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: metanorma/ci/gh-rubygems-setup-action@main
        with:
          token: ${{ secrets.pat_token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby.version }}
          bundler-cache: true
          rubygems: ${{ matrix.ruby.rubygems }}
          bundler: ${{ matrix.ruby.bundler }}

      - run: bundle exec rake

      # - if: needs.prepare.outputs.public == 'true' && matrix.os == 'ubuntu-latest' && matrix.ruby.version == needs.prepare.outputs.default-ruby-version
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: coverage/.resultset.json

  build-matrices:
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.flavor.outputs.value }}
      samples-matrix: ${{ steps.build-samples-matrix.outputs.matrix }}
      templates-matrix: ${{ steps.build-templates-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - run: wget https://raw.githubusercontent.com/metanorma/ci/main/.github/workflows/ruby-matrix.json

      - id: flavor
        run: |
          FLAVOR=$(echo "${{ github.repository }}" | rev | cut -d- -f1 | rev)
          echo "value=${FLAVOR}" >> $GITHUB_OUTPUT

      - id: build-samples-matrix
        env:
          FLAVOR: ${{ steps.flavor.outputs.value }}
        run: |
          # remove after 'cimas sync'
          if [ "${FLAVOR}" != "cli" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f ${{ inputs.samples-matrix-json-file }} ]; then
            if curl --fail --head "https://github.com/metanorma/mn-samples-${FLAVOR}"; then
              echo "{ \"flavor\": [ { \"id\": \"${FLAVOR}\", \"experimental\": false } ] }" > ${{ inputs.samples-matrix-json-file }}
            else
              echo "No ${{ inputs.samples-matrix-json-file }} or https://github.com/metanorma/mn-samples-${FLAVOR} found!"
              echo "Commit ${{ inputs.samples-matrix-json-file }} or pass custom file in samples-matrix-json-file"
              echo "matrix=[]" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          # remove 'middle' & 'experimental' versions
          echo "$(jq 'del(.ruby[1, 2])' ruby-matrix.json)" > ruby-matrix.json
          echo "matrix=$(jq -s add ${{ inputs.samples-matrix-json-file }} ruby-matrix.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - id: build-templates-matrix
        env:
          FLAVOR: ${{ steps.flavor.outputs.value }}
        run: |
          # remove after 'cimas sync'
          if [ "${FLAVOR}" != "cli" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f ${{ inputs.templates-matrix-json-file }} ]; then
            if ! wget https://raw.githubusercontent.com/metanorma/mn-templates-${FLAVOR}/master/.github/workflows/matrix.json -O ${{ inputs.templates-matrix-json-file }}; then
              echo "No ${{ inputs.templates-matrix-json-file }} or https://github.com/metanorma/mn-templates-${FLAVOR} found!"
              echo "Commit ${{ inputs.templates-matrix-json-file }} or pass custom file in templates-matrix-json-file"
              echo "matrix=[]" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "matrix=$(jq -s add ${{ inputs.templates-matrix-json-file }} ruby-matrix.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

  test-templates:
    name: Test template ${{ matrix.type }}-${{ matrix.doctype }}-${{ matrix.ruby.version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
    - rake
    - build-matrices

    if: ${{ needs.build-matrices.outputs.templates-matrix != '[]' }}

    concurrency:
      group: 'template-${{ matrix.flavor.id }}-${{ matrix.doctype }}-${{ matrix.os }}-${{ matrix.ruby.version }}-${{ github.head_ref || github.ref_name }}'
      cancel-in-progress: true

    continue-on-error: ${{ matrix.experimental || matrix.ruby.experimental }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrices.outputs.templates-matrix) }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: metanorma/ci/gh-rubygems-setup-action@main
      with:
        token: ${{ secrets.pat_token }}

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}
        bundler-cache: true

    - uses: actions-mn/cli/new@main
      with:
        type: ${{ matrix.type }}
        doctype: ${{ matrix.doctype }}
        output-path: template
        template: https://github.com/metanorma/mn-templates-${{ matrix.type }}
        overwrite: true
        use-bundler: true

    - run: |
        rm -f Gemfile.lock
        bundle config set --local frozen false
        echo 'eval_gemfile("../Gemfile.devel") rescue nil' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-standoc"' Gemfile || echo 'gem "metanorma-standoc", github: "metanorma/metanorma-standoc", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "suma"' Gemfile || echo 'gem "suma", github: "metanorma/suma", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-ogc"' Gemfile || echo 'gem "metanorma-ogc", github: "metanorma/metanorma-ogc", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-itu"' Gemfile || echo 'gem "metanorma-itu", github: "metanorma/metanorma-itu", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-iec"' Gemfile || echo 'gem "metanorma-iec", github: "metanorma/metanorma-iec", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-generic"' Gemfile || echo 'gem "metanorma-generic", github: "metanorma/metanorma-generic", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-ieee"' Gemfile || echo 'gem "metanorma-ieee", github: "metanorma/metanorma-ieee", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-jis"' Gemfile || echo 'gem "metanorma-jis", github: "metanorma/metanorma-jis", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-iho"' Gemfile || echo 'gem "metanorma-iho", github: "metanorma/metanorma-iho", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-bipm"' Gemfile || echo 'gem "metanorma-bipm", github: "metanorma/metanorma-bipm", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-iso"' Gemfile || echo 'gem "metanorma-iso", github: "metanorma/metanorma-iso", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-ietf"' Gemfile || echo 'gem "metanorma-ietf", github: "metanorma/metanorma-ietf", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-oiml"' Gemfile || echo 'gem "metanorma-oiml", github: "metanorma/metanorma-oiml", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "isodoc"' Gemfile || echo 'gem "isodoc", github: "metanorma/isodoc", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-document"' Gemfile || echo 'gem "metanorma-document", github: "metanorma/metanorma-document", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-core"' Gemfile || echo 'gem "metanorma-core", github: "metanorma/metanorma-core", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "relaton"' Gemfile || echo 'gem "relaton", "~> 3.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "relaton-render"' Gemfile || echo 'gem "relaton-render", "~> 3.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "relaton-cli"' Gemfile || echo 'gem "relaton-cli", "~> 3.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "pubid"' Gemfile || echo 'gem "pubid", "~> 2.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "sassc-embedded"' Gemfile || echo 'gem "sassc-embedded", "~> 1.80"' >> Gemfile
        bundle remove metanorma-${{ needs.build-matrices.outputs.flavor }} --skip-install || true
        bundle add metanorma-${{ needs.build-matrices.outputs.flavor }} --path .. --skip-install
        bundle add sassc --skip-install
        # git gem 6.0.0 removed Repository#branches (fontist repo setup,
        # fontist#493 pending) — hold the samples bundle on the 5.x line
        bundle add git --version '~> 5.7' --skip-install
        bundle install
      shell: bash
      working-directory: template

    - name: Determine config file for template
      id: config-file-template
      run: |
        if [ -f template/metanorma.test.yml ]; then
          echo "config-file=metanorma.test.yml" >> $GITHUB_OUTPUT
        else
          echo "config-file=metanorma.yml" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - if: matrix.type == 'ietf'
      uses: metanorma/ci/tool-setup-action@main
      with:
        setup-tools: 'xml2rfc'

    - uses: actions-mn/site-gen@v2
      with:
        source-path: template
        config-file: ${{ steps.config-file-template.outputs.config-file }}
        agree-to-terms: true
        use-bundler: true
        strict: true

    - if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: template-${{ needs.build-matrices.outputs.flavor }}-${{ matrix.ruby.version }}-error-log
        path: template/_site/**/*.err.html

  test-samples:
    name: Test sample ${{ matrix.flavor.id }}-${{ matrix.ruby.version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
    - rake
    - build-matrices

    if: ${{ needs.build-matrices.outputs.samples-matrix != '[]' }}

    concurrency:
      group: 'sample-${{ matrix.flavor.id }}-${{ matrix.os }}-${{ matrix.ruby.version }}-${{ github.head_ref || github.ref_name }}'
      cancel-in-progress: true

    continue-on-error: ${{ matrix.ruby.experimental || matrix.flavor.experimental }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrices.outputs.samples-matrix) }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: metanorma/mn-samples-${{ matrix.flavor.id }}
        token: ${{ secrets.pat_token }}
        path: samples
        fetch-depth: 1

    - name: Determine config file for samples
      id: config-file-samples
      run: |
        if [ -f samples/metanorma.test.yml ]; then
          echo "config-file=metanorma.test.yml" >> $GITHUB_OUTPUT
        else
          echo "config-file=metanorma.yml" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Pre-release stack pins (standoc relaton-cli-3, ogc relaton-3 shadow fix, suma svg_conform-0.2)
      run: |
        # Sample Gemfiles still carry exact engine pins from earlier engine
        # eras (leptris = 1.9.31x, moxml = 0.5.13x) that deadlock or
        # desync fresh resolves against the current vectory/leptris line;
        # the smoke bundle floats the engine line.
        sed -i.bak -e '/^gem "leptris", "[0-9]/d' -e '/^gem "moxml", "[0-9]/d' Gemfile && rm -f Gemfile.bak
        # The appends below must not fuse onto a last line that lacks a
        # trailing newline (a Gemfile without one parses as a syntax error
        # after the first append).
        tail -c 1 Gemfile | od -An -c | grep -q '\\n' || echo >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-standoc"' Gemfile || echo 'gem "metanorma-standoc", github: "metanorma/metanorma-standoc", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-ogc"' Gemfile || echo 'gem "metanorma-ogc", github: "metanorma/metanorma-ogc", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "suma"' Gemfile || echo 'gem "suma", github: "metanorma/suma", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-itu"' Gemfile || echo 'gem "metanorma-itu", github: "metanorma/metanorma-itu", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-iec"' Gemfile || echo 'gem "metanorma-iec", github: "metanorma/metanorma-iec", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-generic"' Gemfile || echo 'gem "metanorma-generic", github: "metanorma/metanorma-generic", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-ieee"' Gemfile || echo 'gem "metanorma-ieee", github: "metanorma/metanorma-ieee", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-jis"' Gemfile || echo 'gem "metanorma-jis", github: "metanorma/metanorma-jis", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-iho"' Gemfile || echo 'gem "metanorma-iho", github: "metanorma/metanorma-iho", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-bipm"' Gemfile || echo 'gem "metanorma-bipm", github: "metanorma/metanorma-bipm", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-iso"' Gemfile || echo 'gem "metanorma-iso", github: "metanorma/metanorma-iso", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-ietf"' Gemfile || echo 'gem "metanorma-ietf", github: "metanorma/metanorma-ietf", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-oiml"' Gemfile || echo 'gem "metanorma-oiml", github: "metanorma/metanorma-oiml", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "isodoc"' Gemfile || echo 'gem "isodoc", github: "metanorma/isodoc", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-document"' Gemfile || echo 'gem "metanorma-document", github: "metanorma/metanorma-document", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "metanorma-core"' Gemfile || echo 'gem "metanorma-core", github: "metanorma/metanorma-core", branch: "main"' >> Gemfile
        grep -qE '^[[:space:]]*gem "relaton"' Gemfile || echo 'gem "relaton", "~> 3.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "relaton-render"' Gemfile || echo 'gem "relaton-render", "~> 3.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "relaton-cli"' Gemfile || echo 'gem "relaton-cli", "~> 3.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "pubid"' Gemfile || echo 'gem "pubid", "~> 2.0.0.pre.alpha"' >> Gemfile
        grep -qE '^[[:space:]]*gem "sassc-embedded"' Gemfile || echo 'gem "sassc-embedded", "~> 1.80"' >> Gemfile
        rm -f Gemfile.lock
      shell: bash
      working-directory: samples
    - uses: metanorma/ci/gh-rubygems-setup-action@main
      with:
        token: ${{ secrets.pat_token }}

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}
        bundler-cache: true
        working-directory: samples

    - run: |
        rm -f Gemfile.lock
        bundle config set --local frozen false
        echo 'eval_gemfile("../Gemfile.devel") rescue nil' >> Gemfile
        bundle remove metanorma-${{ needs.build-matrices.outputs.flavor }} --skip-install || true
        bundle add metanorma-${{ needs.build-matrices.outputs.flavor }} --path .. --skip-install
        bundle add sassc --skip-install
        # git gem 6.0.0 removed Repository#branches (fontist repo setup,
        # fontist#493 pending) — hold the samples bundle on the 5.x line
        bundle add git --version '~> 5.7' --skip-install
        cat Gemfile
        bundle install
      shell: bash
      working-directory: samples

    - if: ${{ matrix.flavor.id == 'bsi' }}
      uses: metanorma/ci/fontist-repo-setup@main
      with:
        private-fonts-pat: ${{ secrets.pat_token }}
        use-bundler: 'true'
        working-directory: samples

    - uses: metanorma/ci/tool-setup-action@main
      with:
        setup-tools: 'inkscape'

    - if: matrix.flavor.id == 'ietf'
      uses: metanorma/ci/tool-setup-action@main
      with:
        setup-tools: 'xml2rfc'

    - uses: actions-mn/site-gen@v2
      with:
        source-path: samples
        config-file: ${{ steps.config-file-samples.outputs.config-file }}
        agree-to-terms: true
        use-bundler: true
        strict: true

    - if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: samples-${{ needs.build-matrices.outputs.flavor }}-${{ matrix.ruby.version }}-error-log
        path: samples/_site/**/*.err.html

  tests-passed:
    needs: [rake, test-samples, test-templates]
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        name: Tests passed
        with:
          token: ${{ secrets.pat_token || github.token }}
          repository: ${{ github.repository }}
          event-type: tests-passed
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "type": "tests-passed"}'

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Repository ready for release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.pat_token || github.token }}
          repository: ${{ github.repository }}
          event-type: do-release
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "type": "do-release"}'
