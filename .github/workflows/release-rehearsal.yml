name: release-rehearsal

# Prove that the whole metanorma gem chain can be released — without
# releasing anything. Single-job by design: the job executes checked-out
# gem code and builds gems from it, so nothing produced here crosses a
# job boundary (no artifact handoff, no cache) — the run is self-contained
# and its only outputs are logs and the step summary.
#
# Run it before dispatching releases (in the same order you intend to
# cut), locally via script/release-rehearsal.sh or here.
# See docs/release-rehearsal.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to rehearse in every chain repo
        required: false
        default: main
      manifest:
        description: Manifest path in this repo
        required: false
        default: .github/workflows/metanorma-chain.json
      ruby_version:
        description: Ruby version (match rubygems-release.yml)
        required: false
        default: '3.3'
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
      manifest:
        type: string
        default: .github/workflows/metanorma-chain.json
      ruby_version:
        type: string
        default: '3.3'

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version || '3.3' }}
          bundler-cache: false
      - name: Rehearse the full chain
        run: |
          bash script/release-rehearsal.sh \
            "${{ inputs.manifest || '.github/workflows/metanorma-chain.json' }}" \
            rehearsal
      - name: Summary
        if: always()
        run: |
          {
            echo "## release-rehearsal summary"
            echo '```'
            cat rehearsal/results.tsv 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload rehearsal logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-logs
          path: rehearsal/logs
          if-no-files-found: ignore
