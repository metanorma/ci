name: dependent-rake

on:
  workflow_call:
    inputs:
      repos-json-file:
        description: json file with array of gems to test
        type: string
        default: .github/workflows/dependent-repos.json
      command:
        description: test command for dependent gem
        type: string
        default: bundle exec rake
      matrix_os:
        description: define the operating systems on which to execute jobs
        type: string
      matrix_ruby:
        description: >-
          define the Ruby matrix on which to execute jobs, as a raw JSON
          array substituted into the builder's jq program (e.g.
          '[{"version":"4.0","rubygems":"latest","bundler":"default","experimental":false}']).
          Empty keeps the default single-version slice of ruby-matrix.json.
        type: string
        required: false
        default: ''
      before-setup-ruby:
        description: Command to execute before setting up Ruby
        type: string
        default: ''
        required: false
      after-setup-ruby:
        description: Command to execute after setting up Ruby
        type: string
        default: ''
        required: false
      shell:
        description: Shell to use for running commands
        type: string
        default: 'bash'
        required: false
      setup-tools:
        description: >-
          Comma-separated list of tools to install (no spaces):
          graphviz,libreoffice,xml2rfc,exiftool,imagemagick,yq
        type: string
        default: ''
        required: false

    secrets:
      pat_token:
        required: false

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@v6

    - id: build-matrix
      run: |
        wget https://raw.githubusercontent.com/metanorma/ci/main/.github/workflows/ruby-matrix.json
        # remove 'middle' & 'experimental' versions
        echo "$(jq 'del(.ruby[1, 2])' ruby-matrix.json)" > ruby-matrix.json
        if [ -n "${{ inputs.matrix_os }}" ]; then
          echo "$(jq '.os = ${{inputs.matrix_os}}' ruby-matrix.json)" > ruby-matrix.json
        fi
        if [ -n "${{ inputs.matrix_ruby }}" ]; then
          echo "$(jq '.ruby = ${{inputs.matrix_ruby}}' ruby-matrix.json)" > ruby-matrix.json
        fi
        echo "matrix=$(jq -s add ${{ inputs.repos-json-file }} ruby-matrix.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

  rake:
    name: ${{ matrix.repo }} ${{ matrix.ruby.version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
    - build-matrix

    concurrency:
      group: '${{ matrix.repo }}-${{ matrix.os }}-${{ matrix.ruby.version }}-${{ github.head_ref || github.ref_name }}'
      cancel-in-progress: true

    continue-on-error: ${{ matrix.experimental || matrix.ruby.experimental }}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    defaults:
      run:
        shell: ${{ inputs.shell }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        token: ${{ secrets.pat_token || github.token }}

    - uses: actions/checkout@v6
      with:
        submodules: recursive
        repository: ${{ matrix.repo }}
        path: dependent
        fetch-depth: 1
        token: ${{ secrets.pat_token || github.token }}

    - if: ${{ inputs.before-setup-ruby != '' }}
      run: ${{ inputs.before-setup-ruby }}
      working-directory: dependent

    - uses: metanorma/ci/gh-rubygems-setup-action@main
      with:
        token: ${{ secrets.pat_token || github.token }}

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby.version }}
        rubygems: ${{ matrix.ruby.rubygems }}
        bundler-cache: true
        working-directory: dependent

    - if: ${{ inputs.after-setup-ruby != '' }}
      run: ${{ inputs.after-setup-ruby }}
      working-directory: dependent

    - name: Replace rubygems's gem with git's one
      shell: python
      run: |
        import fileinput
        import glob
        import subprocess
        import sys
        import os
        import re
        gem_name = '${{ github.event.repository.name }}'
        # The GitHub repo name does not always match the gem name declared
        # in the gemspec (e.g. the unitsdb-ruby repo ships the "unitsdb"
        # gem; unitsml-ruby ships "unitsml"). Read the gem name from the
        # upstream gemspec at the workspace root so `bundle add` resolves
        # to the right gem. Falls back to the repo name when no gemspec
        # is present.
        upstream_gemspecs = glob.glob('../*.gemspec')
        if upstream_gemspecs:
          with open(upstream_gemspecs[0]) as gemspec_file:
            for line in gemspec_file:
              match = re.match(r'\s*spec\.name\s*=\s*["\']([^"\']+)["\']', line)
              if match:
                gem_name = match.group(1)
                break
          print("Detected gem name from {}: {}".format(upstream_gemspecs[0], gem_name))
        # Keep the dependent's gemspec as it is: specs may read it (e.g.
        # metanorma-document's gemspec_dependencies_spec checks every
        # load-time require is declared there), and Bundler uses the
        # Gemfile path source below for the gem anyway. Only when the
        # gemspec's version requirement rejects the checked-out version
        # is that requirement dropped (the gem name stays declared).
        name_pattern = re.escape(gem_name)
        gemspec_dependency = re.compile(
          r"""^(\s*\w+\.add_(?:runtime_|development_)?dependency\s*\(?\s*["']""" + name_pattern + r"""["'])\s*,[^)#\n]*""")
        gemfile_dependency = re.compile(
          r"""^\s*gem\s*\(?\s*["']""" + name_pattern + r"""["']""")
        if glob.glob('*.gemspec') and upstream_gemspecs:
          gemspec = glob.glob('*.gemspec')[0]
          check = subprocess.run(
            ["ruby", "-e",
             "up = Gem::Specification.load(ARGV[0]); dep = Gem::Specification.load(ARGV[1]); "
             "abort('could not load gemspecs') unless up && dep; "
             "d = dep.dependencies.find { |x| x.name == up.name }; "
             "puts(d.nil? || d.requirement.satisfied_by?(up.version) ? 'ok' : \"#{d.requirement} rejects #{up.version}\")",
             os.path.abspath(upstream_gemspecs[0]), gemspec],
            capture_output=True, text=True)
          verdict = check.stdout.strip() or check.stderr.strip()
          print("{} requirement on '{}': {}".format(gemspec, gem_name, verdict))
          if check.returncode == 0 and verdict != 'ok':
            with fileinput.FileInput(gemspec, inplace=True) as file:
              for line in file:
                print(gemspec_dependency.sub(r'\1', line), end='')
            print("'{}' version requirement relaxed in {}".format(gem_name, gemspec))
        if os.path.exists("Gemfile"):
          removed = 0
          with fileinput.FileInput("Gemfile", inplace=True) as file:
            for line in file:
              if gemfile_dependency.match(line):
                removed += 1
              else:
                print(line, end='')
          print("{} '{}' line(s) removed from Gemfile".format(removed, gem_name))
        if os.path.exists("Gemfile.lock"):
          os.remove("Gemfile.lock")
          print("Gemfile.lock dropped")
        # ruby/setup-ruby's bundler-cache sets deployment mode (frozen)
        # in .bundle/config; frozen + the deleted lockfile makes
        # `bundle add` abort with "Frozen mode is set, but there's no
        # lockfile" (metanorma/uniword dependent leg, 2026-09-24).
        subprocess.run("bundle config unset --local deployment", shell=True)
        subprocess.run("bundle config unset --local frozen", shell=True)
        print("> git diff")
        sys.stdout.flush()
        subprocess.run("git diff", check=False, shell=True)
        print("> bundle add {} --path ..".format(gem_name))
        sys.stdout.flush()
        subprocess.run("bundle add {} --path ..".format(gem_name), check=True, shell=True)
      working-directory: dependent

    - uses: metanorma/ci/tool-setup-action@main
      with:
        setup-tools: ${{ inputs.setup-tools }}

    - run: ${{ inputs.command }}
      working-directory: dependent
