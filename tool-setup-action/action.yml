name: 'tool-setup-action'
description: >-
  Installs CI tools specified by a comma-separated list.
  Supported tools: graphviz, libreoffice,
  xml2rfc, exiftool, ffmpeg, imagemagick, yq.
  (inkscape and ghostscript were retired 2026-11-12: no fleet consumer
  invokes them; their setup actions live in git history.)
  To add a new tool: create its *-setup-action, then add a step here.
inputs:
  setup-tools:
    description: >-
      Comma-separated list of tools to install (no spaces):
      graphviz,libreoffice,xml2rfc,exiftool,ffmpeg,imagemagick,yq
    default: ''
runs:
  using: "composite"
  steps:
    - if: contains(format(',{0},', inputs.setup-tools), ',graphviz,')
      uses: metanorma/ci/graphviz-setup-action@main

    - if: contains(format(',{0},', inputs.setup-tools), ',libreoffice,')
      uses: metanorma/ci/libreoffice-setup-action@main

    - if: contains(format(',{0},', inputs.setup-tools), ',xml2rfc,')
      uses: metanorma/ci/xml2rfc-setup-action@main

    - if: contains(format(',{0},', inputs.setup-tools), ',exiftool,')
      uses: metanorma/ci/exiftool-setup-action@main

    - if: contains(format(',{0},', inputs.setup-tools), ',ffmpeg,')
      uses: metanorma/ci/ffmpeg-setup-action@main

    - if: contains(format(',{0},', inputs.setup-tools), ',imagemagick,')
      uses: metanorma/ci/imagemagick-setup-action@main

    - if: contains(format(',{0},', inputs.setup-tools), ',yq,')
      uses: metanorma/ci/yq-setup-action@main
